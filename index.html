<meta charset="utf-8">

<title>Everywhere, Lucas</title>
<meta name="description" content="여행 크리에이터 루카스의 채널, 인기 영상, 여행 추천템, 가이드 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#1546FF; --blue-deep:#0B2BB0; --neon:#D9FF3F;
    --ink:#0E1430; --muted:#5B6385; --line:#E3E7F5; --bg:#FFFFFF; --soft:#F3F6FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* NAV */
  nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .logo span{background:var(--neon);padding:0 6px;border-radius:4px}
  .menu{display:flex;gap:22px;font-size:14px;font-weight:600;color:var(--muted)}
  .menu a:hover{color:var(--blue)}
  .lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:none;padding:6px 12px;font:700 12px Pretendard,sans-serif;cursor:pointer;color:var(--ink)}
  .lang button.on{background:var(--ink);color:#fff}

  /* HERO */
  .hero{background:var(--blue);color:#fff;padding:72px 0 64px;overflow:hidden;position:relative}
  .hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--neon)}
  .hero h1{font-size:clamp(40px,7vw,76px);font-weight:900;line-height:1.05;letter-spacing:-.04em;margin:14px 0 18px}
  .hero h1 em{font-style:normal;color:var(--neon)}
  .hero p{font-size:17px;opacity:.88;max-width:440px}
  .hero-cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:15px}
  .btn.neon{background:var(--neon);color:var(--ink)}
  .btn.ghost{border:1.5px solid rgba(255,255,255,.6)}
  .photo{aspect-ratio:4/5;border-radius:28px;background:linear-gradient(160deg,#3D6BFF,var(--blue-deep));border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:14px;position:relative}
  .photo img{width:100%;height:100%;object-fit:cover;border-radius:26px}
  .badge{position:absolute;bottom:-14px;left:-14px;background:var(--neon);color:var(--ink);font-weight:800;padding:12px 16px;border-radius:16px;font-size:14px;transform:rotate(-4deg)}

  /* SECTIONS */
  section{padding:80px 0}
  .head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
  .head .eyebrow{color:var(--blue)}
  .head h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em;margin-top:6px}
  .head p{color:var(--muted);font-size:15px;max-width:380px}

  /* VIDEOS */
  #videos{background:var(--soft)}
  .tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;font:700 14px Pretendard,sans-serif;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tab .soon{font-size:10px;background:var(--neon);color:var(--ink);padding:2px 6px;border-radius:6px;margin-left:4px}
  .vid-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .vid{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:linear-gradient(170deg,#C9D5FF,#8FA6FF);display:block;transition:.2s}
  .vid:hover{transform:translateY(-4px)}
  .vid img{width:100%;height:100%;object-fit:cover}
  .vid .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(14,20,48,.45);font-size:13px}
  .vid .views{position:absolute;top:12px;left:12px;background:var(--neon);color:var(--ink);font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px}
  .vid .play{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:11px;color:var(--blue)}
  .vid .info{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(14,20,48,.85));color:#fff}
  .vid h3{font-size:15px;line-height:1.35;letter-spacing:-.02em}
  .vid .place{font-size:12px;opacity:.8;margin-top:4px}
  .vid .map{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.18)}
  .empty{background:#fff;border-radius:18px;padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}

  /* ITEMS */
  .item-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
  .item{flex:0 0 240px;scroll-snap-align:start;border-radius:22px;background:#fff;border:1.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .item:hover{border-color:var(--blue);transform:translateY(-3px)}
  .item .img{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative}
  .item .img img{width:100%;height:100%;object-fit:cover}
  .item .cat{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--neon);font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px}
  .item .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .item h3{font-size:16px;letter-spacing:-.02em}
  .item p{font-size:13px;color:var(--muted);flex:1}
  .item .buy{margin-top:8px;text-align:center;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:10px;border-radius:12px}
  .disclose{font-size:12px;color:var(--muted);margin-top:14px}

  /* GUIDES */
  .guides{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .guide{border-radius:20px;overflow:hidden;border:1.5px solid var(--line);transition:.2s}
  .guide:hover{border-color:var(--blue)}
  .thumb{aspect-ratio:16/10;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:13px}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .guide div.t{padding:16px 18px 20px}
  .tag{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em}
  .guide h3{font-size:17px;margin-top:6px;letter-spacing:-.02em}

  /* CHANNELS */
  .channels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .ch{border:1.5px solid var(--line);border-radius:20px;padding:22px;transition:.2s;display:flex;flex-direction:column;gap:30px}
  .ch:hover{border-color:var(--blue);transform:translateY(-3px)}
  .ch.main{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ch .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
  .ch.main .top{color:var(--neon)}
  .ch b{font-size:19px;letter-spacing:-.02em}
  .arrow{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-size:14px}
  .ch.main .arrow{background:var(--neon);color:var(--ink)}

  /* CONTACT */
  .contact{background:var(--ink);color:#fff;border-radius:28px;padding:48px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}
  .contact h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.03em}
  .contact h2 em{font-style:normal;color:var(--neon)}
  .contact p{opacity:.7;margin-top:10px}

  footer{padding:50px 0 40px;border-top:1px solid var(--line);margin-top:80px}
  footer .wrap{display:grid;grid-template-columns:200px 1fr;gap:30px}
  footer .eyebrow{color:var(--blue)}
  footer p{color:var(--muted);font-size:14px}
  .copy{margin-top:30px;font-size:12px;color:var(--muted)}

  @media(max-width:760px){
    .menu{display:none}
    .hero{padding:48px 0}
    .hero .wrap{grid-template-columns:1fr}
    .photo{max-width:300px}
    section{padding:56px 0}
    .guides{grid-template-columns:1fr}
    .channels{grid-template-columns:1fr 1fr}
    .vid-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .vid h3{font-size:13px}
    .contact{grid-template-columns:1fr;padding:32px 24px}
    footer .wrap{grid-template-columns:1fr}
  }
</style>
</head>

function fmt(n){
  if(lang==="ko") return n>=10000 ? Math.round(n/10000)+"만" : n.toLocaleString();
  return n>=1e6 ? (n/1e6).toFixed(1).replace(".0","")+"M" : n>=1000 ? Math.round(n/1000)+"K" : n;
}
function render(){
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t[el.dataset.i18n]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));

  channelList.innerHTML = CHANNELS.map(c => `
    <a class="ch ${c.main?'main':''}" href="${c.url}" target="_blank">
      <div class="top"><span>${c[lang]}</span><span class="arrow">↗</span></div>
      <div><b>${typeof c.name==="object" ? c.name[lang] : c.name}</b><div style="font-size:13px;opacity:.7">${c.handle}</div></div>
    </a>`).join("");

  tabs.innerHTML = REGIONS.map(r => `
    <button class="tab ${r.id===region?'on':''}" data-r="${r.id}">${r[lang]}${r.soon?`<span class="soon">${t.soon}</span>`:''}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => { region = b.dataset.r; render(); });

  const list = VIDEOS.filter(v => v.region === region);
  vidList.innerHTML = list.length ? list.map(v => `
    <a class="vid" href="${v.url}" target="_blank">
      ${v.thumb ? `<img src="${v.thumb}" alt="">` : `<span class="ph">${t.noImg}</span>`}
      <span class="views">▶ ${fmt(v.views)}</span>
      <div class="info">
        <h3>${v.title[lang]}</h3>
        <div class="place">📍 ${v.place[lang]}</div>
        ${v.map ? `<span class="map" onclick="event.preventDefault();event.stopPropagation();window.open('${v.map}','_blank')">${t.map} ↗</span>` : ''}
      </div>
    </a>`).join("") : `<div class="empty">${t.empty}</div>`;

  itemList.innerHTML = ITEMS.map(it => `
    <a class="item" href="${it.url}" target="_blank" rel="noopener sponsored">
      <div class="img">${it.img ? `<img src="${it.img}" alt="">` : t.noImg}<span class="cat">${it.cat}</span></div>
      <div class="body"><h3>${it.name[lang]}</h3><p>${it.why[lang]}</p><div class="buy">${t.buy}</div></div>
    </a>`).join("");

  guideList.innerHTML = GUIDES.map(g => `
    <a class="guide" href="${g.url}" target="_blank">
      <div class="thumb">${g.img ? `<img src="${g.img}" alt="">` : t.noImg}</div>
      <div class="t"><div class="tag">${g.tag}</div><h3>${g.title[lang]}</h3></div>
    </a>`).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch(e){}
  render();
});
render();
</script>
</body>
</html>
